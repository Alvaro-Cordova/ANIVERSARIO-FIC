<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pruebas Supabase</title>
</head>

<body>

    <h1>Prueba Supabase</h1>

    <input
        id="correo"
        type="email"
        value="participante1@example.com"
        placeholder="Correo"
    >

    <input
        id="password"
        type="password"
        placeholder="Contraseña"
    >

    <button id="btnLogin">
        Iniciar sesión
    </button>

    <button id="btnInscribir">
        Inscribirme al evento gratuito
    </button>

    <button id="btnEventoPago">
        Inscribirme al evento con pago
    </button>

    <button id="btnQrPago">
    Obtener QR del evento con pago
    </button>

    <button id="btnVerificarPago">
    Admin: verificar pago
    </button>

    <button id="btnLogout">
        Cerrar sesión
    </button>

    <button id="btnSesion">
        Ver sesión
    </button>

    <button id="btnPonencia">
    Inscribirme a ponencia
    </button>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    

    <pre id="resultado"></pre>

    <script
        type="module"
        src="./prueba-supabase.js">
    </script>

</body>

</html>

<hr>

<h2>Prueba de equipos</h2>

<button id="btnCrearEquipo">
    Crear equipo de concurso
</button>

<br><br>

<input
    id="codigoEquipo"
    type="text"
    placeholder="Código de invitación"
>

<button id="btnUnirseEquipo">
    Unirme al equipo
</button>

<br><br>

<input
    id="idEquipo"
    type="text"
    placeholder="ID del equipo"
>

<button id="btnInscribirEquipo">
    Inscribir equipo al concurso
</button>

<hr>

<h2>Prueba de asistencia</h2>

<button id="btnQrGratuito">
    Obtener QR del evento gratuito
</button>

<br><br>

<input
    id="tokenQr"
    type="text"
    placeholder="Token QR del participante"
>

<button id="btnEscanearPonencia">
    Escanear QR en ponencia
</button>

<hr>

<h2>Prueba de cursos</h2>

<button id="btnCursoSuelos">
    Usar ponencia para Mecánica de Suelos
</button>

<button id="btnCursoVial">
    Usar misma ponencia para Diseño Vial
</button>

<hr>

<h2>Prueba de presencia V3.2</h2>

<input
    id="tokenQrSala"
    type="text"
    placeholder="Token QR participante"
>

<button id="btnEscanearAuditorio">
    Escanear en Auditorio
</button>

<button id="btnEscanearSala2">
    Escanear en Sala Secundaria
</button>

<button id="btnMiAsistencia">
    Ver mi asistencia
</button>

<hr>

<h2>Prueba de reportes por curso</h2>

<button id="btnReporteSuelos">
    Reporte Mecánica de Suelos
</button>

<button id="btnReporteVial">
    Reporte Diseño Vial
</button>

<button id="btnExcelSuelos">
    Descargar Excel - Mecánica de Suelos
</button>

<button id="btnExcelVial">
    Descargar Excel - Diseño Vial
</button>
