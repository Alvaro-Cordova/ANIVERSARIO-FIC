<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Aniversario FIC</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="auth-contenedor">
        <section class="auth-tarjeta">
            <h1>Crear cuenta</h1>
            <p class="auth-subtitulo">
                Regístrate para participar en el evento.
            </p>

            <p id="mensaje-registro" class="mensaje" hidden></p>

            <form id="formulario-registro" novalidate>

                <div class="auth-fila">
                    <div>
                        <label for="reg-nombres">Nombres</label>
                        <input
                            type="text"
                            id="reg-nombres"
                            name="nombres"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <div>
                        <label for="reg-apellidos">Apellidos</label>
                        <input
                            type="text"
                            id="reg-apellidos"
                            name="apellidos"
                            autocomplete="family-name"
                            required
                        >
                    </div>
                </div>

                <label for="reg-correo">Correo</label>
                <input
                    type="email"
                    id="reg-correo"
                    name="correo"
                    autocomplete="email"
                    required
                >

                <div class="auth-fila">
                    <div>
                        <label for="reg-password">Contraseña</label>
                        <input
                            type="password"
                            id="reg-password"
                            name="password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div>
                        <label for="reg-confirmar-password">
                            Confirmar contraseña
                        </label>
                        <input
                            type="password"
                            id="reg-confirmar-password"
                            name="confirmarPassword"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <div class="auth-fila">
                    <div>
                        <label for="reg-codigo-matricula">
                            Código de matrícula
                        </label>
                        <input
                            type="text"
                            id="reg-codigo-matricula"
                            name="codigoMatricula"
                            required
                        >
                    </div>

                    <div>
                        <label for="reg-semestre">Semestre</label>
                        <input
                            type="text"
                            id="reg-semestre"
                            name="semestre"
                            placeholder="Ej. 2026-II"
                            required
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    id="btn-registro"
                    class="boton-primario"
                >
                    Crear cuenta
                </button>
            </form>

            <p class="auth-enlace">
                ¿Ya tienes cuenta?
                <a href="iniciar-sesion.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <script type="module" src="interfaz.js"></script>
</body>
</html>
